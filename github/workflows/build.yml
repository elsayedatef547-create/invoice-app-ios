name: Build iOS IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build Unsigned IPA
    runs-on: macos-14

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: latest-stable

    - name: Create iOS Native Wrapper (Swift)
      run: |
        mkdir -p App

        cat << 'EOF' > App/App.swift
        import SwiftUI
        import WebKit

        struct WebView: UIViewRepresentable {
            func makeUIView(context: Context) -> WKWebView {
                let config = WKWebViewConfiguration()
                config.allowsInlineMediaPlayback = true
                config.mediaTypesRequiringUserActionForPlayback = []
                let webView = WKWebView(frame: .zero, configuration: config)
                webView.allowsBackForwardNavigationGestures = true
                return webView
            }
            func updateUIView(_ uiView: WKWebView, context: Context) {
                if let url = Bundle.main.url(forResource: "index", withExtension: "html") {
                    uiView.loadFileURL(url, allowingReadAccessTo: url.deletingLastPathComponent())
                }
            }
        }

        @main
        struct InvoiceApp: App {
            var body: some Scene {
                WindowGroup {
                    WebView().ignoresSafeArea()
                }
            }
        }
        EOF

        cat << 'EOF' > App/Info.plist
        <?xml version="1.0" encoding="UTF-8"?>
        <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
        <plist version="1.0">
        <dict>
            <key>CFBundleDevelopmentRegion</key><string>$(DEVELOPMENT_LANGUAGE)</string>
            <key>CFBundleExecutable</key><string>$(EXECUTABLE_NAME)</string>
            <key>CFBundleIdentifier</key><string>$(PRODUCT_BUNDLE_IDENTIFIER)</string>
            <key>CFBundleInfoDictionaryVersion</key><string>6.0</string>
            <key>CFBundleName</key><string>$(PRODUCT_NAME)</string>
            <key>CFBundlePackageType</key><string>$(PRODUCT_BUNDLE_PACKAGE_TYPE)</string>
            <key>CFBundleShortVersionString</key><string>1.0</string>
            <key>CFBundleVersion</key><string>1</string>
            <key>LSRequiresIPhoneOS</key><true/>
            <key>UILaunchScreen</key><dict/>
            <key>UISupportedInterfaceOrientations</key>
            <array><string>UIInterfaceOrientationPortrait</string></array>
            <key>NSCameraUsageDescription</key><string>لقراءة الفواتير والباركود</string>
            <key>NSPhotoLibraryUsageDescription</key><string>لاختيار صور الفواتير</string>
            <key>NSAppTransportSecurity</key>
            <dict><key>NSAllowsArbitraryLoads</key><true/></dict>
        </dict>
        </plist>
        EOF

        cat << 'EOF' > project.yml
        name: InvoiceApp
        options:
          bundleIdPrefix: com.elsayed
          deploymentTarget:
            iOS: "15.0"
        targets:
          InvoiceApp:
            type: application
            platform: iOS
            sources: [App]
            settings:
              base:
                INFOPLIST_FILE: App/Info.plist
                PRODUCT_BUNDLE_IDENTIFIER: com.elsayed.invoiceapp
                CODE_SIGNING_ALLOWED: NO
                CODE_SIGNING_REQUIRED: NO
                CODE_SIGN_IDENTITY: ""
        EOF

        cp index_optimized_fixed.html App/index.html

    - name: Build iOS App
      run: |
        brew install xcodegen
        xcodegen generate
        xcodebuild -project InvoiceApp.xcodeproj -scheme InvoiceApp -sdk iphoneos -configuration Release -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""

    - name: Package into Unsigned IPA
      run: |
        mkdir -p Payload
        cp -r build/Build/Products/Release-iphoneos/InvoiceApp.app Payload/
        zip -r InvoiceApp-Unsigned.ipa Payload

    - name: Upload IPA Artifact
      uses: actions/upload-artifact@v4
      with:
        name: InvoiceApp-Unsigned-IPA
        path: InvoiceApp-Unsigned.ipa
